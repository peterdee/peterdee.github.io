<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/index.css"
      rel="stylesheet"
    />
    <link
      crossorigin="anonymous"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      referrerpolicy="no-referrer"
      rel="stylesheet"
    />
    <meta
      content="width=device-width, initial-scale=1"
      name="viewport"
    />
    <title>
      Peter Dyumin
    </title>
  </head>
  <body>
    <div class="theme-switch">
      <input
        class="checkbox"
        id="theme-switch"
        type="checkbox"
      />
      <label
        for="theme-switch"
        class="checkbox-label"
        title="Switch theme"
      >
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
        <span class="ball"></span>
      </label>
    </div>
    <main id="content">
      <div class="name">
        Peter Dyumin
      </div>
      <div class="row">
        Lead Fullstack Developer, Team Lead
      </div>
      <div class="row">
        <a
          href="mailto:peter.dyumin@gmail.com"
          target="_blank"
        >
          Contact
        </a>
      </div>
      <div class="row-last">
        <a
          href="https://github.com/peterdee"
          target="_blank"
        >
          Github
        </a>
      </div>
    </main>
    <footer class="transparent">
      <div class="footer-logo footer-margin transparent">
        <img
          alt="Logo"
          class="footer-logo transparent"
          id="logo"
          src="/favicon.svg"
        />
      </div>
      <a
        class="footer-margin transparent"
        href="https://dyum.in"
        target="_blank"
      >
        Peter Dyumin
      </a>
      <span class="footer-margin transparent">
        ©
      </span>
      <span
        class="transparent"
        id="year"
      ></span>
    </footer>
    <div class="waves-container">
      <svg
        class="waves"
        id="waves"
        preserveAspectRatio="none"
        shape-rendering="auto"
        viewBox="0 24 150 28"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
      >
        <defs>
          <path
            d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
            id="gentle-wave"
          />
        </defs>
        <g class="parallax">
          <use
            fill="rgba(205, 205, 205, 0.7)"
            x="48"
            xlink:href="#gentle-wave"
            y="0"
          />
          <use
            fill="rgba(205, 205, 205, 0.5)"
            x="48"
            xlink:href="#gentle-wave"
            y="3"
          />
          <use
            fill="rgba(205, 205, 205, 0.3)"
            x="48"
            xlink:href="#gentle-wave"
            y="5"
          />
          <use
            fill="rgba(205, 205, 205, 0.9)"
            x="48"
            xlink:href="#gentle-wave"
            y="7"
          />
        </g>
      </svg>
    </div>
    <script>
      const darkFavicon = 'favicon.svg';
      const darkThemeName = 'dark';
      const lightFavicon = 'favicon-light.svg';
      const lightThemeName = 'light';
      const storageKey = 'theme';
      const themes = {
        [darkThemeName]: `
          --accent: #E0F0FF;
          --accent-dark: #2090B0;
          --background: #1F1F24;
          --text: #FFFFFF;        
        `,
        [lightThemeName]: `
          --accent: #020070;
          --accent-dark: #000040;
          --background: #FFFFFF;
          --text: #2F2F2F;
        `,
      };

      let selectedTheme = localStorage.getItem(storageKey);
      if (selectedTheme !== darkThemeName && selectedTheme !== lightThemeName) {
        selectedTheme = '';
      }
      if (!selectedTheme) {
        selectedTheme = lightThemeName;
        localStorage.setItem(storageKey, selectedTheme);
      }
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.querySelector(`link[rel~='icon']`).href = lightFavicon;
        if (!selectedTheme) {
          selectedTheme = darkThemeName;
          localStorage.setItem(storageKey, selectedTheme);
        }
      }
      if (selectedTheme === darkThemeName) {
        document.getElementById('logo').src = lightFavicon;
      }
      document.getElementsByTagName('body')[0].style = themes[selectedTheme];

      const themeSwitch = document.getElementById('theme-switch');
      themeSwitch.checked = selectedTheme === lightThemeName;
      themeSwitch.addEventListener(
        'change',
        (event) => {
          let newLogo = lightFavicon;
          let newTheme = darkThemeName;
          if (event.target.checked) {
            newLogo = darkFavicon;
            newTheme = lightThemeName;
          }
          document.getElementById('logo').src = newLogo;
          document.getElementsByTagName('body')[0].style = themes[newTheme];
          localStorage.setItem(storageKey, newTheme);
        },
      );

      if (/Mobi/i.test(window.navigator.userAgent)) {
        document.getElementById('content').classList.add('main-mobile');
        document.getElementById('waves').classList.add('waves-mobile');
      }
      const year = new Date().getFullYear();
      document.getElementById('year').append(year);
    </script>
  </body>
</html>
